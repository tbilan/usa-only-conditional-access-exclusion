name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # sign in to Azure with GitHub's OIDC token (no stored Azure password)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    # Only from main, and only once infra/setup-cicd.ps1 has configured the repository.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Base resources (registry, file share, environment)
        id: base
        run: |
          out=$(az deployment group create -g "$RG" -f infra/base.bicep -p location="$LOCATION" --query properties.outputs -o json)
          echo "acr=$(echo "$out" | jq -r .acrName.value)" >> "$GITHUB_OUTPUT"
          echo "server=$(echo "$out" | jq -r .acrLoginServer.value)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: image
        run: |
          az acr login -n "${{ steps.base.outputs.acr }}"
          image="${{ steps.base.outputs.server }}/caex:${{ github.sha }}"
          docker build -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy container app
        env:
          APP_CLIENT_SECRET: ${{ secrets.APP_CLIENT_SECRET }}
          APP: ${{ vars.APP_NAME }}
          DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt 2>/dev/null
          ENVNAME=cae-usa-only-ca
          APP=$(echo "$APP" | tr '[:upper:]' '[:lower:]')

          # ID of the managed certificate for the custom domain, if it has been issued already.
          cert_id() {
            az containerapp env certificate list -g "$RG" -n "$ENVNAME" \
              --query "[?properties.subjectName=='$DOMAIN' && contains(id, 'managedCertificates')].id | [0]" -o tsv 2>/dev/null || true
          }
          deploy() { # $1 = custom domain (or empty), $2 = certificate id (or empty)
            az deployment group create -g "$RG" -f infra/app.bicep \
              -p appName="$APP" location="$LOCATION" image="$IMAGE" \
                 clientId="${{ vars.APP_CLIENT_ID }}" partnerTenantId="${{ vars.PARTNER_TENANT_ID }}" \
                 timeZone="${{ vars.APP_TIMEZONE }}" clientSecret="$APP_CLIENT_SECRET" \
                 customDomain="$1" certificateId="$2" \
              --query properties.outputs -o json
          }

          CERT=""
          if [ -n "$DOMAIN" ]; then CERT=$(cert_id); fi
          out=$(deploy "${CERT:+$DOMAIN}" "$CERT")

          # First time with a custom domain: add it, issue a free managed certificate, then redeploy using it.
          if [ -n "$DOMAIN" ] && [ -z "$CERT" ]; then
            az containerapp hostname add -g "$RG" -n "$APP" --hostname "$DOMAIN" >/dev/null 2>&1 || true
            if az containerapp hostname bind -g "$RG" -n "$APP" --hostname "$DOMAIN" --environment "$ENVNAME" --validation-method CNAME >/dev/null; then
              CERT=$(cert_id)
              out=$(deploy "$DOMAIN" "$CERT")
            else
              host=$(echo "$out" | jq -r .defaultHost.value)
              vid=$(echo "$out" | jq -r .domainVerificationId.value)
              sub="${DOMAIN%%.*}"
              echo "::warning::Custom domain $DOMAIN is not bound yet. Add the DNS records shown in the run summary, then re-run this workflow."
              {
                echo "### Custom domain not bound yet"
                echo "Add these DNS records for \`$DOMAIN\`, wait a few minutes, then re-run this workflow:"
                echo ""
                echo "| Type | Name | Value |"
                echo "|---|---|---|"
                echo "| CNAME | \`$sub\` | \`$host\` |"
                echo "| TXT | \`asuid.$sub\` | \`$vid\` |"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          url=$(echo "$out" | jq -r .url.value)
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Redirect URIs to register: $url/auth/callback and $url/consent-done.html" >> "$GITHUB_STEP_SUMMARY"
